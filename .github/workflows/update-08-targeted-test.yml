name: Update 08 targeted Gemini test

on:
  push:
    branches:
      - update-08-gemini-multimodal-fallback

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Update 08 Gemini tests
        run: ./gradlew :ai:testDebugUnitTest --tests me.rerere.ai.provider.providers.google.GoogleFunctionResponseMediaTest --no-daemon --stacktrace
