name: Update 01 memory build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
      GEMINI_OAUTH_CLIENT_ID: ${{ secrets.GEMINI_OAUTH_CLIENT_ID }}
      GEMINI_OAUTH_CLIENT_SECRET: ${{ secrets.GEMINI_OAUTH_CLIENT_SECRET }}
    steps:
      - name: Check out source and native submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Install Android SDK dependencies
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865"

      - name: Prepare release signing configuration
        shell: bash
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_STORE_PASS: ${{ secrets.SIGNING_STORE_PASS }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASS: ${{ secrets.SIGNING_KEY_PASS }}
        run: |
          if [ -n "$SIGNING_KEYSTORE" ] && [ -n "$SIGNING_STORE_PASS" ] && [ -n "$SIGNING_KEY_ALIAS" ] && [ -n "$SIGNING_KEY_PASS" ]; then
            printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > app/nastech-release.jks
            cat > local.properties <<EOF
storeFile=nastech-release.jks
storePassword=$SIGNING_STORE_PASS
keyAlias=$SIGNING_KEY_ALIAS
keyPassword=$SIGNING_KEY_PASS
EOF
          else
            fallback_keystore="$RUNNER_TEMP/nastech-ci-debug.keystore"
            keytool -genkeypair -noprompt \
              -keystore "$fallback_keystore" \
              -storetype JKS \
              -storepass android \
              -keypass android \
              -alias nastech-ci-debug \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Nastech CI, OU=Engineering, O=Nastech, L=Internet, ST=Internet, C=US"
            cat > local.properties <<EOF
storeFile=$fallback_keystore
storePassword=android
keyAlias=nastech-ci-debug
keyPassword=android
EOF
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web interface dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: update-01-memory-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
