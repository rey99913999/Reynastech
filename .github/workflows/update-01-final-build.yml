name: Update 01 final release verification

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
      GEMINI_OAUTH_CLIENT_ID: ${{ secrets.GEMINI_OAUTH_CLIENT_ID }}
      GEMINI_OAUTH_CLIENT_SECRET: ${{ secrets.GEMINI_OAUTH_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Android build packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865"

      - name: CI signing key
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_STORE_PASS: ${{ secrets.SIGNING_STORE_PASS }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASS: ${{ secrets.SIGNING_KEY_PASS }}
        run: |
          if [ -n "$SIGNING_KEYSTORE" ] && [ -n "$SIGNING_STORE_PASS" ] && [ -n "$SIGNING_KEY_ALIAS" ] && [ -n "$SIGNING_KEY_PASS" ]; then
            printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > app/nastech-release.jks
            cat > local.properties <<EOF
storeFile=nastech-release.jks
storePassword=$SIGNING_STORE_PASS
keyAlias=$SIGNING_KEY_ALIAS
keyPassword=$SIGNING_KEY_PASS
EOF
          else
            keytool -genkeypair -noprompt \
              -keystore "$RUNNER_TEMP/nastech-ci.keystore" \
              -storetype JKS \
              -storepass android \
              -keypass android \
              -alias nastech-ci \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Nastech CI, OU=Engineering, O=Nastech, L=Internet, ST=Internet, C=US"
            cat > local.properties <<EOF
storeFile=$RUNNER_TEMP/nastech-ci.keystore
storePassword=android
keyAlias=nastech-ci
keyPassword=android
EOF
          fi

      - name: Bun
        uses: oven-sh/setup-bun@v2

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Web dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: update-01-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
