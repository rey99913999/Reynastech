name: Build Nastech release APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the signed universal APK as a GitHub release
        required: false
        default: false
        type: boolean
      release_tag:
        description: Release tag to publish when release publication is enabled
        required: false
        default: ""
        type: string
      release_title:
        description: Release title to publish when release publication is enabled
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: nastech-release-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
      GEMINI_OAUTH_CLIENT_ID: ${{ secrets.GEMINI_OAUTH_CLIENT_ID }}
      GEMINI_OAUTH_CLIENT_SECRET: ${{ secrets.GEMINI_OAUTH_CLIENT_SECRET }}
    steps:
      - name: Check out source and native submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Create artifact label
        id: label
        shell: bash
        run: |
          raw_label="$(git log -1 --format='%s')"
          safe_label="$(printf '%s' "$raw_label" | LC_ALL=C tr -cd '[:alnum:] ._()-' | sed 's/^ *//;s/ *$//' | cut -c1-60)"
          printf 'label=%s\n' "${safe_label:-build}" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Install Android build dependencies
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865"

      - name: Prepare release signing configuration
        shell: bash
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_STORE_PASS: ${{ secrets.SIGNING_STORE_PASS }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASS: ${{ secrets.SIGNING_KEY_PASS }}
        run: |
          set -euo pipefail

          missing=()
          [ -n "$SIGNING_KEYSTORE" ] || missing+=("SIGNING_KEYSTORE")
          [ -n "$SIGNING_STORE_PASS" ] || missing+=("SIGNING_STORE_PASS")
          [ -n "$SIGNING_KEY_ALIAS" ] || missing+=("SIGNING_KEY_ALIAS")
          [ -n "$SIGNING_KEY_PASS" ] || missing+=("SIGNING_KEY_PASS")

          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'ERROR: Stable Release signing is not configured. Missing GitHub Actions secret(s): %s\n' "${missing[*]}" >&2
            printf 'The workflow will not generate a Release APK with a temporary or random signing key.\n' >&2
            exit 1
          fi

          printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > app/nastech-release.jks

          cat > local.properties <<EOF
          storeFile=nastech-release.jks
          storePassword=$SIGNING_STORE_PASS
          keyAlias=$SIGNING_KEY_ALIAS
          keyPassword=$SIGNING_KEY_PASS
          EOF

          echo "Release signing configuration is available."
          echo "Release certificate fingerprint:"
          keytool -list -v \
            -keystore app/nastech-release.jks \
            -storepass "$SIGNING_STORE_PASS" \
            -alias "$SIGNING_KEY_ALIAS" \
            | grep -E '^(Certificate fingerprints:|[[:space:]]+SHA256:)' || true
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web interface dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run debug unit tests
        if: ${{ !contains(github.event.head_commit.message, '[skip-tests]') }}
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Enable KVM for Android emulator
        if: ${{ !contains(github.event.head_commit.message, '[skip-tests]') }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run accessibility service config instrumentation test
        if: ${{ !contains(github.event.head_commit.message, '[skip-tests]') }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euo pipefail
            app_id='io.github.nastechresearch.nastech.debug'
            service_class='io.github.nastechresearch.nastech.service.RikkaAccessibilityService'
            test_class='io.github.nastechresearch.nastech.service.AccessibilityServiceConfigTest'

            # Install both APKs before enabling the service, so Android can resolve and bind it.
            ./gradlew :app:installDebug :app:installDebugAndroidTest --no-daemon --stacktrace

            component="${app_id}/${service_class}"
            enabled="$(adb shell settings get secure enabled_accessibility_services | tr -d '\\r')"
            case ":${enabled}:" in
              *":${component}:"*) ;;
              *) if [ "${enabled}" = "null" ] || [ -z "${enabled}" ]; then enabled="${component}"; else enabled="${enabled}:${component}"; fi ;;
            esac
            adb shell settings put secure enabled_accessibility_services "${enabled}"
            adb shell settings put secure accessibility_enabled 1

            # Discover the instrumentation package instead of assuming its generated application ID.
            runner="$(adb shell pm list instrumentation | tr -d '\\r' | grep -F "(target=${app_id})" | grep -F "/androidx.test.runner.AndroidJUnitRunner" | sed -E 's/^instrumentation:([^ ]+).*/\\1/' | head -n 1)"
            test -n "${runner}" || { echo "Android instrumentation runner not found for ${app_id}" >&2; adb shell pm list instrumentation; exit 1; }
            echo "Running ${test_class} with ${runner}"
            output="$(adb shell am instrument -w -r -e class "${test_class}" "${runner}" 2>&1)" || { printf '%s\\n' "${output}"; exit 1; }
            printf '%s\\n' "${output}"
            printf '%s\\n' "${output}" | grep -Eq 'OK \\([0-9]+ tests?\\)' || { echo "Instrumentation test did not report success" >&2; exit 1; }

      - name: Build debug APK
        if: always()
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nastech-debug-${{ github.sha }}-${{ steps.label.outputs.label }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build release APK
        if: always()
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nastech-release-${{ github.sha }}-${{ steps.label.outputs.label }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish signed GitHub release
        if: success() && inputs.publish_release == true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TITLE: ${{ inputs.release_title }}
        run: |
          test -n "$RELEASE_TAG"
          apk_path="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n1)"
          test -n "$apk_path"
          gh release create "$RELEASE_TAG" "$apk_path#Nastech-${RELEASE_TAG}.apk" \
            --target "$GITHUB_SHA" \
            --title "${RELEASE_TITLE:-Nastech $RELEASE_TAG}" \
            --notes "Signed Nastech Android release built from $GITHUB_SHA."
